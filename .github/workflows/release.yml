name: release

# Publishes the CLI to npm. Run it by hand from the Actions tab: nothing is
# published by a push, so a release is always a deliberate act.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: read
  # Trusted publishing: npm trades this token for a short-lived credential, so
  # there is no long-lived secret to leak, and it records where the package was
  # built from.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # The same gate as CI: nothing reaches npm that has not passed it.
      - run: pnpm check
      - run: pnpm smoke

      # Trusted publishing lives in the npm CLI, and needs 11.5.1 or newer.
      # pnpm has no part in it, so pnpm builds the tarball — which is what
      # resolves the workspace: protocol — and npm is what sends it.
      - run: npm install --global npm@latest
      - run: npm --version
      - run: pnpm --filter deepblame pack --pack-destination "$RUNNER_TEMP"
      - name: Publish
        run: npm publish "$RUNNER_TEMP"/deepblame-*.tgz --access public --tag "${{ inputs.tag }}"
