name: release

# Publishes the CLI to npm. Run it by hand from the Actions tab: nothing is
# published by a push, so a release is always a deliberate act.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: read
  # Lets npm record where the package was built from (provenance).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The same gate as CI: nothing reaches npm that has not passed it.
      - run: pnpm check
      - run: pnpm smoke
      - run: pnpm --filter deepblame publish --access public --no-git-checks --tag ${{ inputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
