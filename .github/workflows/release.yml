name: release

# Publishes the CLI to npm. Run it by hand from the Actions tab: nothing is
# published by a push, so a release is always a deliberate act.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under
        default: latest
        type: choice
        options: [latest, next]

permissions:
  # Creating the release and its tag. Everything else stays read-only.
  contents: write
  # Trusted publishing: npm trades this token for a short-lived credential, so
  # there is no long-lived secret to leak, and it records where the package was
  # built from.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # The same gate as CI: nothing reaches npm that has not passed it.
      - run: pnpm check
      - run: pnpm smoke

      # Trusted publishing lives in the npm CLI, and needs 11.5.1 or newer.
      # pnpm has no part in it, so pnpm builds the tarball — which is what
      # resolves the workspace: protocol — and npm is what sends it.
      - run: npm install --global npm@latest
      - run: npm --version
      - run: pnpm --filter deepblame pack --pack-destination "$RUNNER_TEMP"
      # Skipped when this version is already out, so a release that failed
      # after publishing can be run again to finish the rest.
      - name: Publish
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "deepblame@$VERSION" version >/dev/null 2>&1; then
            echo "deepblame@$VERSION is already on npm; skipping the publish."
            exit 0
          fi
          npm publish "$RUNNER_TEMP"/deepblame-*.tgz --access public --tag "${{ inputs.tag }}"

      # Everything below is the GitHub release: the tag, the notes, and the
      # one file people actually download.
      - name: Work out the version
        id: version
        run: echo "value=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the VS Code extension
        run: |
          pnpm --filter deepblame-vscode build
          npx --yes @vscode/vsce package --no-dependencies \
            --out "$RUNNER_TEMP/deepblame-vscode-${{ steps.version.outputs.value }}.vsix"
        working-directory: packages/vscode

      # Notes come from CHANGELOG.md, not from the commit log: this repository
      # is updated by uploading files, so nearly every commit is called "Add
      # files via upload" and generated notes would say nothing.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; leaving it alone."
            exit 0
          fi
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/deepblame-vscode-*.vsix \
            "$RUNNER_TEMP"/deepblame-*.tgz
