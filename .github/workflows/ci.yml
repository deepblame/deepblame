name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test the packed CLI in a fresh repository
        shell: bash
        run: |
          (cd packages/cli && npm pack --pack-destination "$RUNNER_TEMP")
          TGZ=$(ls "$RUNNER_TEMP"/deepblame-*.tgz)
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke" && git init -q
          npm exec --yes --package="$TGZ" -- deepblame init
          npm exec --yes --package="$TGZ" -- deepblame status
